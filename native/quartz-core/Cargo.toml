[package]
name = "quartz-core"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
name = "quartz_core"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
