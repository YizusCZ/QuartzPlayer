plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.quartzyoutube'
version = '1.0.0'

android {
  namespace 'expo.modules.quartzyoutube'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // NewPipeExtractor (GPL-3.0): YouTube search, playlists and audio stream URLs.
  implementation('com.github.TeamNewPipe:NewPipeExtractor:v0.26.5') {
    // The javax.script bridge is unused, and javax.script does not exist on Android.
    exclude group: 'org.mozilla', module: 'rhino-engine'
  }
  // The same OkHttp React Native already ships.
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
}
