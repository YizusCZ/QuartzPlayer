plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.appupdate'
version = '1.0.0'

android {
  namespace "expo.modules.appupdate"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // FileProvider: hands the downloaded APK to Android's installer.
  implementation 'androidx.core:core:1.13.1'
}
